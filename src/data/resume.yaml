# Single source of truth for the resume.
# Feeds /resume/, the home-page credentials strip, and the generated PDF.
# After editing, run `npm run resume:pdf` and commit the regenerated PDF.
# Never add phone, street address, date of birth, or other personal identifiers.

basics:
  # name is pulled from src/data/site.ts when omitted
  headline: Robotics engineer & master electrician
  summary: >-
    Robotics engineer and licensed master electrician with 6 years of hands-on electrical work running an
    independent contracting business. Strong troubleshooter across electrical, mechanical, and software
    systems, with project experience in motion control, machine vision, and embedded programming. Seeking
    a controls or automation engineering role where hands-on field skills and an engineering background both
    add value.

highlights:
  - B.S. Robotics Engineering from Widener University
  - PA Master Electrician; TN Limited Licensed Electrician
  - 6+ years running a licensed electrical contracting business

experience:
  - org: Matlack Electric
    role: Owner & Master Electrician
    location: PA → TN
    start: 2020-03
    end: null # null = Present
    bullets:
      - 'Built and run a licensed, insured electrical contracting business; 500+ invoiced jobs across service calls, small installs, and large remodel and addition projects.'
      - 'Performed diagnostics and maintenance on production equipment at a commercial printing facility, replacing a DC speed controller on a shrink-wrap machine, a 480V transformer on an automated paper cutter, and a pneumatic pump.'
      - 'Diagnose and repair electrical faults on residential and commercial service calls, often on systems with no documentation.'
      - 'Install and start up standby generators and automatic transfer switches (Generac certified) and EV charging equipment (Tesla certified).'
      - 'Design and program lighting control systems for custom homes (Lutron Preferred Pro with RadioRA certification).'
      - 'Manage projects end to end: estimating, material ordering, scheduling, code compliance, inspections, and customer communication.'

education:
  - school: Widener University
    degree: B.S. Robotics Engineering
    start: 2018-08
    end: 2023-08
    bullets:
      - 'Relevant coursework: PLC programming (Allen-Bradley CCW), UR5e cobot programming, robot kinematics (PUMA 560 simulation), three-phase power systems, feedback control systems.'
      - 'Co-founder and President, Widener Robotics Club. Received the School of Engineering Ambassador Award for organizing a large robotics tournament as a freshman.'

